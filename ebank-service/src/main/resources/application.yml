server:
  address: 127.0.0.1
  port: 8082
spring:
  application:
    name: ebank-service
  cloud:
    openfeign:
      client:
        config:
          customer-service:
            connect-timeout: 1000
            read-timeout: 2000
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
